# 只跑安卓这条链路：自查 + 两个构建 + 把 App 资源传成 artifact。
#
# 这里出不了 APK。APK 需要 DCloud 的运行时壳（HBuilderX 云打包，或它那份要登录下载、
# 不许再分发的 Android 离线打包 SDK），ubuntu runner 上没有这两样，
# 所以这一步只到 dist/build/app 为止；点「云打包」那一下仍然在本地。
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-resources:
    name: 自查 + 出 App 资源
    runs-on: ubuntu-latest
    # 卡住的任务不该白烧到 runner 自己的 6 小时上限
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 版本只有一份来源：仓库根的 .nvmrc。本地 `nvm use` 读它，这里也读它——
      # 两边不一致是会咬人的：punycode 那轮的判据就跟 ICU 版本绑，CI 用 24、本地手跑用 22，
      # 同一套断言一边绿一边红。
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 条码与二维码自查的第三方判官（读回原文才算真验证）。装了就得装上，
      # 缺了测试只会打印 SKIP 然后照样全绿，那是假绿，所以这里直接把断言卡在下一步前面。
      - name: 装外部判官 zbarimg / ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zbar-tools imagemagick
          command -v zbarimg
          command -v magick || command -v convert

      - name: 装依赖
        run: npm ci

      # 静态检查放在最前面：它最便宜，错了就没必要再花时间构建。
      # 口径见 eslint.config.mjs —— 只卡正确性、不卡排版；首次接入时按 warn 放行的
      # 那 112 处存量已于 2026-09-29/09-30 逐条清零并升为 error，所以这一步现在是真门禁：
      # 有任何 error 当场红，绿的意思就是「零 error 零 warning」。
      - name: 静态检查（ESLint）
        run: npm run lint

      # 「加了工具忘改 README/manifest」的提交在这里被拦下，而不是靠本地手跑。
      - name: 文档与注册表对撞（check:docs）
        run: npm run check:docs

      - name: 全量自查
        run: npm test

      # 这一条专门盯 UNI_LITERAL 那类坑：H5 产物按「源码里字面出现过 uni.xxx」做按需注入，
      # 只有真跑一次 build:h5 才压得住，单测看到的是完整的 uni 对象。
      - name: 构建 H5 预览
        run: npm run build:h5

      - name: 构建 App 资源
        run: npm run build:app

      - name: 检查产物非空
        run: |
          test -s dist/build/app/app-service.js
          test -s dist/build/app/app-config-service.js
          find dist/build/app -type f | wc -l

      - name: 上传 App 资源
        uses: actions/upload-artifact@v4
        with:
          name: pocket-kit-app-${{ github.sha }}
          path: dist/build/app
          if-no-files-found: error
          retention-days: 14
